receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: normal
  otlp_http/observability:
    endpoint: ${env:JBOOT_OBSERVABILITY_OTLP_ENDPOINT}
    sending_queue:
      enabled: true
      queue_size: 1024
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/observability]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/observability]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/observability]
