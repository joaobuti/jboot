#   extends: [.git_push_deploy, .identity_admin_rules]
#   stage: deploy-staging
#   needs: ["identity-admin:build"]
#   environment:
#     name: staging/identity-admin
#     url: https://stg-admin.jboot.com.br
#   variables:
#     DEPLOY_SOURCE_DIR: implementations/app-jboot-identity-admin
#     DEPLOY_SSH_TARGET: $IDENTITY_ADMIN_SSH_TARGET_STG
#     DEPLOY_REMOTE_PATH: admin.jboot.com.br/www
#
# identity-admin:smoke-staging:
#   extends: .identity_admin_rules
#   stage: smoke-staging
#   needs: ["identity-admin:deploy-staging"]
#   image: curlimages/curl:8.11.1
#   script:
#     - curl -fsS -o /dev/null -w '%{http_code}\n' https://stg-admin.jboot.com.br/

identity-admin:deploy-production:
  extends: [.rsync_deploy, .identity_admin_rules]
  stage: deploy-production
  needs: ["identity-admin:build"]
  when: manual
  environment:
    name: production/identity-admin
    url: https://admin.jboot.com.br
  variables:
    DEPLOY_SOURCE_DIR: implementations/app-jboot-identity-admin/.next/standalone
    DEPLOY_SSH_TARGET: $IDENTITY_ADMIN_SSH_TARGET_PROD
    DEPLOY_REMOTE_PATH: admin.jboot.com.br/www

identity-admin:smoke-production:
  extends: .identity_admin_rules
  stage: smoke-production
  needs: ["identity-admin:deploy-production"]
  image: curlimages/curl:8.11.1
  script:
    - curl -fsS -o /dev/null -w '%{http_code}\n' https://admin.jboot.com.br/
