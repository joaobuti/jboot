extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: []
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-gateway
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8888"]
        - job_name: mimir
          scrape_interval: 30s
          static_configs:
            - targets: ["mimir:9009"]
        - job_name: tempo
          scrape_interval: 30s
          static_configs:
            - targets: ["tempo:3200"]
        - job_name: loki
          scrape_interval: 30s
          static_configs:
            - targets: ["loki:3100"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource/defaults:
    attributes:
      - key: deployment.environment.name
        value: ${env:OBS_ENVIRONMENT}
        action: upsert
  resource/redact:
    attributes:
      - key: enduser.id
        action: delete
      - key: enduser.email
        action: delete
      - key: user.email
        action: delete
      - key: user.full_name
        action: delete
      - key: jboot.client.document
        action: delete
      - key: db.connection_string
        action: delete
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: db.statement
        action: delete
      - key: messaging.message.body
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

connectors:
  span_metrics:
    namespace: jboot_traces
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    exemplars:
      enabled: true
    dimensions:
      - name: deployment.environment.name
      - name: jboot.product
      - name: jboot.application

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    headers:
      X-Scope-OrgID: ${env:OBS_TENANT_ID}
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
  prometheus_remote_write/mimir:
    endpoint: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: ${env:OBS_TENANT_ID}
    remote_write_queue:
      enabled: true
      queue_size: 20000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    headers:
      X-Scope-OrgID: ${env:OBS_TENANT_ID}
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, resource/redact, attributes/redact, batch]
      exporters: [otlp_http/tempo, span_metrics]
    metrics:
      receivers: [otlp, prometheus, span_metrics]
      processors: [memory_limiter, resource/defaults, resource/redact, attributes/redact, batch]
      exporters: [prometheus_remote_write/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, resource/redact, attributes/redact, batch]
      exporters: [otlp_http/loki]
