apiVersion: 1

deleteDatasources:
  - name: Mimir
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Mimir
    uid: jboot-mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      prometheusVersion: 3.0.6
      httpHeaderName1: X-Scope-OrgID
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jboot-tempo
    secureJsonData:
      httpHeaderValue1: $OBS_TENANT_ID

  - name: Tempo
    uid: jboot-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: jboot-mimir
      tracesToLogsV2:
        datasourceUid: jboot-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: jboot-mimir
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service_name
    secureJsonData:
      httpHeaderValue1: $OBS_TENANT_ID

  - name: Loki
    uid: jboot-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace[_-]?id["=: ]+([a-fA-F0-9]{32})'
          datasourceUid: jboot-tempo
          url: '$${__value.raw}'
    secureJsonData:
      httpHeaderValue1: $OBS_TENANT_ID

