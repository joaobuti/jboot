#   extends: [.rsync_deploy, .landing_rules]
#   stage: deploy-staging
#   needs: ["landing:build"]
#   environment:
#     name: staging/landing
#     url: https://stg.jboot.com.br
#   variables:
#     DEPLOY_SOURCE_DIR: implementations/site-jboot-landing/out
#     DEPLOY_SSH_TARGET: $LANDING_SSH_TARGET_STG
#     DEPLOY_REMOTE_PATH: jboot.com.br/www/ecosystem/implementations/site-jboot-landing/out
#
# landing:smoke-staging:
#   extends: .landing_rules
#   stage: smoke-staging
#   needs: ["landing:deploy-staging"]
#   image: curlimages/curl:8.11.1
#   script:
#     - curl -fsS -o /dev/null -w '%{http_code}\n' https://stg.jboot.com.br/

landing:deploy-production:
  extends: [.rsync_deploy, .landing_rules]
  stage: deploy-production
  needs: ["landing:build"]
  when: manual
  environment:
    name: production/landing
    url: https://jboot.com.br
  variables:
    DEPLOY_SOURCE_DIR: implementations/site-jboot-landing/out
    DEPLOY_SSH_TARGET: $LANDING_SSH_TARGET_PROD
    DEPLOY_REMOTE_PATH: jboot.com.br/www/ecosystem/implementations/site-jboot-landing/out

landing:smoke-production:
  extends: .landing_rules
  stage: smoke-production
  needs: ["landing:deploy-production"]
  image: curlimages/curl:8.11.1
  script:
    - curl -fsS -o /dev/null -w '%{http_code}\n' https://jboot.com.br/
