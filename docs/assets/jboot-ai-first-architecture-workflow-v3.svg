        <text x="85" y="24" text-anchor="middle" class="text">Identity BFF</text>
        <text x="85" y="42" text-anchor="middle" class="mini">NestJS</text>
      </g>
      <g transform="translate(0 80)">
        <rect width="374" height="62" rx="10" class="chipG"/>
        <text x="187" y="27" text-anchor="middle" class="text">Platform Shell</text>
        <text x="187" y="47" text-anchor="middle" class="mini">PDV / Flow / Juridico / Comanda</text>
      </g>
      <g transform="translate(0 168)">
        <rect width="374" height="62" rx="10" class="chipG"/>
        <text x="187" y="27" text-anchor="middle" class="text">Platform BFF</text>
        <text x="187" y="47" text-anchor="middle" class="mini">PDV / Flow / Juridico / Catalog / Clientes</text>
      </g>
      <g transform="translate(0 256)">
        <rect width="174" height="54" rx="10" class="ghost"/>
        <text x="87" y="24" text-anchor="middle" class="text">Juridico Worker</text>
        <text x="87" y="42" text-anchor="middle" class="mini">portais</text>
      </g>
      <g transform="translate(204 256)">
        <rect width="170" height="54" rx="10" class="chipP"/>
        <text x="85" y="24" text-anchor="middle" class="text">Fiscal Service</text>
        <text x="85" y="42" text-anchor="middle" class="mini">Laravel</text>
      </g>
      <g transform="translate(0 336)">
        <rect width="174" height="54" rx="10" class="ghost"/>
        <text x="87" y="24" text-anchor="middle" class="text">PDV Mobile</text>
        <text x="87" y="42" text-anchor="middle" class="mini">offline</text>
      </g>
      <g transform="translate(204 336)">
        <rect width="170" height="54" rx="10" class="chip"/>
        <text x="85" y="24" text-anchor="middle" class="text">Sites Publicos</text>
        <text x="85" y="42" text-anchor="middle" class="mini">landing / portfolio</text>
      </g>
      <g transform="translate(0 416)">
        <rect width="374" height="54" rx="10" class="chipG"/>
        <text x="187" y="24" text-anchor="middle" class="text">Observability Ops</text>
        <text x="187" y="42" text-anchor="middle" class="mini">metrics / traces / runbooks</text>
      </g>
