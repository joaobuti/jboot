  <path d="M510 330C570 330 570 320 635 300" class="wire"/>
  <path d="M510 694C590 694 590 470 638 452" class="wire"/>
  <path d="M1250 380C1320 380 1320 340 1400 340" class="wireP"/>
  <path d="M1250 758C1308 758 1328 740 1400 740" class="wireG"/>
  <path d="M960 606V686" class="wire"/>
  <path d="M1615 830C1615 930 304 930 304 830" class="wireG"/>

  <g transform="translate(80 900)">
    <rect width="1750" height="86" rx="16" fill="rgba(3,15,24,.82)" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
    <text x="28" y="34" class="head">Contrato operacional</text>
    <text x="28" y="60" class="text">PO/PE/Architect fecham escopo e stack; Marketing/UI-UX entram por natureza da entrega; stack subagents orientam; agents locais executam; harness valida.</text>
    <text x="1718" y="34" text-anchor="end" class="mini">AI-first engineering: make ai-conformance</text>
    <text x="1718" y="60" text-anchor="end" class="muted">AI product runtime: planejado em src/ai</text>
