    <text x="28" y="38" class="head" fill="#fb7185">IMPLEMENTACOES SATELITE</text>
    <text x="28" y="66" class="text">Contratos locais + agents/skills locais</text>
    <g transform="translate(28 100)">
      <g>
        <rect width="174" height="54" rx="10" class="chip"/>
        <text x="87" y="24" text-anchor="middle" class="text">Identity Admin</text>
        <text x="87" y="42" text-anchor="middle" class="mini">Next UI</text>
      </g>
      <g transform="translate(204 0)">
