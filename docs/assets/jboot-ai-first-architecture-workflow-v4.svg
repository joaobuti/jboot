<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">JBoot AI-first workflow light theme</title>
  <desc id="desc">Light modern workflow diagram using the JBoot cyan-white palette, showing agents, stack subagents, harness, runtime adapters and satellite implementations.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="52%" stop-color="#eef8fb"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#0891b2"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#10b981"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:42px;font-weight:900;letter-spacing:0;fill:#111827}
      .sub{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:650;letter-spacing:0;fill:#334155}
      .head{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:850;letter-spacing:0;fill:#0f172a}
      .text{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:650;letter-spacing:0;fill:#334155}
      .mini{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:0;fill:#0f766e}
      .tag{font-family:Inter,Arial,sans-serif;font-size:10px;font-weight:850;letter-spacing:0;fill:#1f2937}
      .muted{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:650;letter-spacing:0;fill:#64748b}
      .panel{fill:rgba(255,255,255,.86);stroke:#22d3ee;stroke-width:2.2;filter:url(#softShadow)}
      .panelSoft{fill:rgba(248,250,252,.9);stroke:#cbd5e1;stroke-width:1.7;filter:url(#softShadow)}
      .panelGreen{fill:rgba(240,253,250,.92);stroke:#10b981;stroke-width:2;filter:url(#softShadow)}
      .panelSlate{fill:rgba(241,245,249,.92);stroke:#64748b;stroke-width:1.8;filter:url(#softShadow)}
      .chip{fill:#ffffff;stroke:#0891b2;stroke-width:1.8}
      .chipCyan{fill:#ecfeff;stroke:#06b6d4;stroke-width:1.8}
      .chipGreen{fill:#ecfdf5;stroke:#10b981;stroke-width:1.8}
      .chipSlate{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7}
      .wire{fill:none;stroke:url(#cyan);stroke-width:4;filter:url(#cyanGlow);marker-end:url(#arrowCyan)}
      .wireGreen{fill:none;stroke:url(#green);stroke-width:4;filter:url(#cyanGlow);marker-end:url(#arrowGreen)}
      .trace{fill:none;stroke:#94a3b8;stroke-width:1.4;opacity:.34}
      .traceC{fill:none;stroke:#06b6d4;stroke-width:1.6;opacity:.42}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#page)"/>

  <g opacity=".85">
    <path class="trace" d="M80 220H260Q292 220 292 252V332Q292 364 324 364H480"/>
    <path class="trace" d="M1450 168H1640Q1672 168 1672 200V296Q1672 328 1805 328"/>
    <path class="trace" d="M132 884H314Q348 884 348 850V760Q348 726 488 726"/>
    <path class="trace" d="M1410 888H1608Q1642 888 1642 854V762Q1642 728 1810 728"/>
    <path class="traceC" d="M584 120V176Q584 206 614 206H792"/>
    <path class="traceC" d="M1284 118V174Q1284 204 1254 204H1076"/>
    <circle cx="260" cy="220" r="5" fill="#06b6d4"/>
    <circle cx="1640" cy="168" r="5" fill="#06b6d4"/>
    <circle cx="584" cy="176" r="5" fill="#22d3ee"/>
    <circle cx="1284" cy="174" r="5" fill="#22d3ee"/>
  </g>

  <text x="72" y="70" class="title">JBoot AI-FIRST WORKFLOW</text>
  <text x="74" y="102" class="sub">Agentes, subagents de stack, skills, adapters e satelites sob governanca executavel</text>
  <text x="1770" y="72" text-anchor="end" class="muted">theme: jb-cyan-white palette</text>

  <g transform="translate(80 168)">
    <rect width="430" height="328" rx="18" class="panel"/>
    <text x="26" y="38" class="head">GLOBAL AGENTS</text>
    <text x="26" y="66" class="text">Orquestracao antes de contrato e codigo</text>
    <g transform="translate(28 96)">
      <g><rect width="104" height="50" rx="10" class="chipCyan"/><text x="52" y="25" text-anchor="middle" class="text">PO</text><text x="52" y="41" text-anchor="middle" class="mini">escopo</text></g>
      <g transform="translate(132 0)"><rect width="104" height="50" rx="10" class="chipCyan"/><text x="52" y="25" text-anchor="middle" class="text">PE</text><text x="52" y="41" text-anchor="middle" class="mini">target</text></g>
      <g transform="translate(264 0)"><rect width="104" height="50" rx="10" class="chipCyan"/><text x="52" y="25" text-anchor="middle" class="text">ARCH</text><text x="52" y="41" text-anchor="middle" class="mini">fit</text></g>
    </g>
    <g transform="translate(28 174)">
      <g><rect width="168" height="56" rx="10" class="chip"/><text x="84" y="26" text-anchor="middle" class="text">Marketing</text><text x="84" y="44" text-anchor="middle" class="mini">paleta / copy</text></g>
      <g transform="translate(200 0)"><rect width="168" height="56" rx="10" class="chipSlate"/><text x="84" y="26" text-anchor="middle" class="text">UI/UX</text><text x="84" y="44" text-anchor="middle" class="mini">fluxo / tela</text></g>
    </g>
    <g transform="translate(28 258)">
      <rect width="368" height="44" rx="10" class="chipGreen"/>
      <text x="184" y="27" text-anchor="middle" class="text">Human confirmation para risco, custo ou stack</text>
    </g>
  </g>

  <g transform="translate(80 558)">
    <rect width="430" height="270" rx="18" class="panel"/>
    <text x="26" y="38" class="head">STACK SUBAGENTS</text>
    <text x="26" y="66" class="text">Principais de mercado + catalogo completo</text>
    <g transform="translate(28 98)">
      <g><rect width="116" height="42" rx="9" class="chipCyan"/><text x="58" y="26" text-anchor="middle" class="tag">Next/Web</text></g>
      <g transform="translate(134 0)"><rect width="116" height="42" rx="9" class="chipCyan"/><text x="58" y="26" text-anchor="middle" class="tag">Node/TS</text></g>
      <g transform="translate(268 0)"><rect width="116" height="42" rx="9" class="chipCyan"/><text x="58" y="26" text-anchor="middle" class="tag">Python</text></g>
      <g transform="translate(0 62)"><rect width="116" height="42" rx="9" class="chipCyan"/><text x="58" y="26" text-anchor="middle" class="tag">Laravel/PHP</text></g>
      <g transform="translate(134 62)"><rect width="116" height="42" rx="9" class="chipCyan"/><text x="58" y="26" text-anchor="middle" class="tag">AI/LLM</text></g>
      <g transform="translate(268 62)"><rect width="116" height="42" rx="9" class="chipSlate"/><text x="58" y="26" text-anchor="middle" class="tag">+14 refs</text></g>
    </g>
    <text x="28" y="228" class="mini">Alimentam Stack Fit Gate; nao substituem agents locais.</text>
  </g>

  <g transform="translate(620 178)">
    <polygon points="70,42 352,0 634,42 352,88" fill="#ffffff" stroke="#0891b2" stroke-width="2.2" filter="url(#softShadow)"/>
    <polygon points="70,42 352,88 352,430 70,382" fill="#f8fafc" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="634,42 352,88 352,430 634,382" fill="#eff6f8" stroke="#64748b" stroke-width="1.8"/>
    <polygon points="70,382 352,430 634,382 352,338" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="352" y="64" text-anchor="middle" class="head">AI-FIRST ENGINEERING HARNESS</text>
    <text x="352" y="112" text-anchor="middle" class="text">Contexto deterministico + gates + evals + evidencia</text>
    <g transform="translate(152 150)">
      <g><rect width="180" height="54" rx="10" class="chipCyan"/><text x="90" y="24" text-anchor="middle" class="text">Context</text><text x="90" y="42" text-anchor="middle" class="mini">make ai-context</text></g>
      <g transform="translate(220 0)"><rect width="180" height="54" rx="10" class="chip"/><text x="90" y="24" text-anchor="middle" class="text">Conformance</text><text x="90" y="42" text-anchor="middle" class="mini">make ai-conformance</text></g>
      <g transform="translate(0 86)"><rect width="180" height="54" rx="10" class="chipCyan"/><text x="90" y="24" text-anchor="middle" class="text">Evals</text><text x="90" y="42" text-anchor="middle" class="mini">regression gates</text></g>
      <g transform="translate(220 86)"><rect width="180" height="54" rx="10" class="chipGreen"/><text x="90" y="24" text-anchor="middle" class="text">Security</text><text x="90" y="42" text-anchor="middle" class="mini">tool matrix</text></g>
    </g>
    <g transform="translate(202 326)">
      <rect width="300" height="58" rx="12" class="chipSlate"/>
      <text x="150" y="25" text-anchor="middle" class="text">AI Product Runtime</text>
      <text x="150" y="44" text-anchor="middle" class="mini">src/ai planejado</text>
    </g>
  </g>

  <g transform="translate(690 690)">
    <rect width="560" height="138" rx="18" class="panelGreen"/>
    <text x="28" y="38" class="head">RUNTIME ADAPTERS</text>
    <text x="28" y="66" class="text">Transportam a regra; nao viram fonte de verdade</text>
    <g transform="translate(28 88)">
      <g><rect width="104" height="32" rx="8" class="chipSlate"/><text x="52" y="21" text-anchor="middle" class="tag">Codex</text></g>
      <g transform="translate(124 0)"><rect width="104" height="32" rx="8" class="chipSlate"/><text x="52" y="21" text-anchor="middle" class="tag">Claude</text></g>
      <g transform="translate(248 0)"><rect width="104" height="32" rx="8" class="chipSlate"/><text x="52" y="21" text-anchor="middle" class="tag">Cursor</text></g>
      <g transform="translate(372 0)"><rect width="104" height="32" rx="8" class="chipSlate"/><text x="52" y="21" text-anchor="middle" class="tag">Copilot</text></g>
    </g>
  </g>

  <g transform="translate(1400 178)">
    <rect width="430" height="650" rx="18" class="panelSoft"/>
    <text x="28" y="38" class="head">IMPLEMENTACOES SATELITE</text>
    <text x="28" y="66" class="text">Contratos locais + agents/skills locais</text>
    <g transform="translate(28 100)">
      <g><rect width="174" height="54" rx="10" class="chipCyan"/><text x="87" y="24" text-anchor="middle" class="text">Identity Admin</text><text x="87" y="42" text-anchor="middle" class="mini">Next UI</text></g>
      <g transform="translate(204 0)"><rect width="170" height="54" rx="10" class="chipCyan"/><text x="85" y="24" text-anchor="middle" class="text">Identity BFF</text><text x="85" y="42" text-anchor="middle" class="mini">NestJS</text></g>
      <g transform="translate(0 80)"><rect width="374" height="62" rx="10" class="chipGreen"/><text x="187" y="27" text-anchor="middle" class="text">Platform Shell</text><text x="187" y="47" text-anchor="middle" class="mini">PDV / Flow / Juridico / Comanda</text></g>
      <g transform="translate(0 168)"><rect width="374" height="62" rx="10" class="chipGreen"/><text x="187" y="27" text-anchor="middle" class="text">Platform BFF</text><text x="187" y="47" text-anchor="middle" class="mini">PDV / Flow / Juridico / Catalog / Clientes</text></g>
      <g transform="translate(0 256)"><rect width="174" height="54" rx="10" class="chipSlate"/><text x="87" y="24" text-anchor="middle" class="text">Juridico Worker</text><text x="87" y="42" text-anchor="middle" class="mini">portais</text></g>
      <g transform="translate(204 256)"><rect width="170" height="54" rx="10" class="chip"/><text x="85" y="24" text-anchor="middle" class="text">Fiscal Service</text><text x="85" y="42" text-anchor="middle" class="mini">Laravel</text></g>
      <g transform="translate(0 336)"><rect width="174" height="54" rx="10" class="chipSlate"/><text x="87" y="24" text-anchor="middle" class="text">PDV Mobile</text><text x="87" y="42" text-anchor="middle" class="mini">offline</text></g>
      <g transform="translate(204 336)"><rect width="170" height="54" rx="10" class="chipCyan"/><text x="85" y="24" text-anchor="middle" class="text">Sites Publicos</text><text x="85" y="42" text-anchor="middle" class="mini">landing / portfolio</text></g>
      <g transform="translate(0 416)"><rect width="374" height="54" rx="10" class="chipGreen"/><text x="187" y="24" text-anchor="middle" class="text">Observability Ops</text><text x="187" y="42" text-anchor="middle" class="mini">metrics / traces / runbooks</text></g>
    </g>
  </g>

  <path d="M510 330C570 330 570 320 635 302" class="wire"/>
  <path d="M510 692C590 692 590 468 638 452" class="wire"/>
  <path d="M1250 382C1322 382 1322 340 1400 340" class="wire"/>
  <path d="M1250 758C1310 758 1330 740 1400 740" class="wireGreen"/>
  <path d="M960 608V686" class="wire"/>
  <path d="M1615 828C1615 924 304 924 304 828" class="wireGreen"/>

  <g transform="translate(80 898)">
    <rect width="1750" height="86" rx="16" class="panel"/>
    <text x="28" y="34" class="head">Contrato operacional</text>
    <text x="28" y="60" class="text">PO/PE/Architect fecham escopo e stack; Marketing/UI-UX entram por natureza da entrega; stack subagents orientam; agents locais executam; harness valida.</text>
    <text x="1718" y="34" text-anchor="end" class="mini">AI-first engineering: make ai-conformance</text>
    <text x="1718" y="60" text-anchor="end" class="muted">AI product runtime: planejado em src/ai</text>
  </g>
</svg>
