    <text x="28" y="34" class="h3">Regra operacional</text>
    <text x="28" y="60" class="body">Stack agents orientam decisao; orchestration agents fecham escopo/gates; implementation agents executam; harness valida; adapters apenas transportam a regra para cada runtime.</text>
