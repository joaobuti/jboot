<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">JBoot AI-first architecture workflow v2</title>
  <desc id="desc">Detailed JBoot AI-first architecture workflow showing orchestration agents, stack reference subagents, runtime adapters, governance harness, local agents and current satellite implementations.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="76%">
      <stop offset="0%" stop-color="#0b3b47"/>
      <stop offset="48%" stop-color="#061923"/>
      <stop offset="100%" stop-color="#02070d"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="42%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#e0faff"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#155266" stroke-width="1" opacity=".35"/>
    </pattern>
    <pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#2dd4bf" stroke-width=".5" opacity=".14"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#fb7185"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#86efac"/>
    </marker>
    <style>
      .h1{font-family:Inter,Arial,sans-serif;font-size:42px;font-weight:900;letter-spacing:0;fill:#ecfeff}
      .h2{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:850;letter-spacing:0;fill:#ecfeff}
      .h3{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:0;fill:#e2e8f0}
      .body{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:550;letter-spacing:0;fill:#c7edf5}
      .mini{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:0;fill:#86efac}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:0;fill:#bae6fd}
      .muted{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:0;fill:#94a3b8}
      .panel{fill:rgba(3,18,28,.84);stroke:#22d3ee;stroke-width:2;filter:url(#glow)}
      .panel2{fill:rgba(7,28,21,.82);stroke:#86efac;stroke-width:2;filter:url(#glow)}
      .panel3{fill:rgba(27,19,54,.82);stroke:#a78bfa;stroke-width:2;filter:url(#glow)}
      .panel4{fill:rgba(39,12,22,.82);stroke:#fb7185;stroke-width:2;filter:url(#glow)}
      .chip{fill:rgba(2,10,18,.94);stroke:#67e8f9;stroke-width:1.7}
      .chipg{fill:rgba(3,20,12,.94);stroke:#86efac;stroke-width:1.7}
      .chipv{fill:rgba(17,14,35,.94);stroke:#a78bfa;stroke-width:1.7}
      .chipp{fill:rgba(31,9,18,.94);stroke:#fb7185;stroke-width:1.7}
      .ghost{fill:rgba(15,23,42,.58);stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 7}
      .wire{fill:none;stroke:url(#cyan);stroke-width:4;filter:url(#glow);marker-end:url(#arrowCyan)}
      .wirep{fill:none;stroke:url(#magenta);stroke-width:4;filter:url(#glow);marker-end:url(#arrowPink)}
      .wireg{fill:none;stroke:url(#green);stroke-width:4;filter:url(#glow);marker-end:url(#arrowGreen)}
      .thin{fill:none;stroke:#67e8f9;stroke-width:1.7;opacity:.8}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#fine)"/>

