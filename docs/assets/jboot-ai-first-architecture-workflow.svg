  <!-- Footer truth statement -->
  <g>
    <line x1="70" y1="1030" x2="1830" y2="1030" class="line"/>
    <text x="72" y="1058" class="small" fill="#94a3b8">Regra operacional: adapters e MCP podem expor capacidades, mas PROJECT_CONTRACT, MODULE_CONTRACT e o harness executavel continuam como fonte de verdade.</text>
    <text x="1830" y="1058" text-anchor="end" class="small" fill="#94a3b8">AI product runtime: planejado; AI-first engineering: conformante quando make ai-conformance aprova.</text>
  </g>
</svg>
