  <path d="M500 710 C558 710 566 746 630 746" class="wire-cyan"/>
  <path d="M1290 484 C1356 484 1356 272 1420 272" class="wire-red"/>
  <path d="M1290 588 C1368 588 1354 760 1420 760" class="wire-green"/>
  <path d="M960 764 V818" class="wire-cyan"/>
  <path d="M500 952 C558 952 566 940 610 940" class="wire-green"/>
  <path d="M1310 904 C1356 904 1368 944 1420 944" class="wire-green"/>
  <path d="M1310 142 H1348" class="wire-green"/>

  <!-- Labels on wires -->
