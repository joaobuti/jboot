    <rect x="610" y="822" width="700" height="166" rx="18" class="panel"/>
    <text x="642" y="860" class="section" fill="#67e8f9">AGENTES E SKILLS LOCAIS</text>
    <text x="642" y="892" class="small">implementations/&lt;project&gt;/agents + implementations/&lt;project&gt;/skills</text>
    <g transform="translate(642 924)">
      <rect width="138" height="40" rx="8" class="ghost"/>
