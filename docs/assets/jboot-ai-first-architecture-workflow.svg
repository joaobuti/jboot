      <text x="80" y="24" text-anchor="middle" class="small">Identity BFF</text>
      <text x="80" y="42" text-anchor="middle" class="tiny">NestJS + JWT</text>
    </g>
    <g transform="translate(1452 406)">
      <rect width="346" height="82" rx="10" class="panel-green"/>
      <text x="173" y="25" text-anchor="middle" class="label">Next Platform Shell</text>
      <text x="173" y="49" text-anchor="middle" class="small">modules: PDV / Flow / Juridico</text>
      <text x="173" y="68" text-anchor="middle" class="tiny">Comanda UI publica sem Identity</text>
    </g>
    <g transform="translate(1452 514)">
      <rect width="346" height="82" rx="10" class="panel-green"/>
      <text x="173" y="25" text-anchor="middle" class="label">Platform BFF</text>
      <text x="173" y="49" text-anchor="middle" class="small">PDV / Flow / Juridico / Catalog</text>
      <text x="173" y="68" text-anchor="middle" class="tiny">Clientes / Comanda / tenant context</text>
    </g>
    <g transform="translate(1452 622)">
      <rect width="160" height="56" rx="10" class="panel-violet"/>
      <text x="80" y="24" text-anchor="middle" class="small">Juridico Worker</text>
      <text x="80" y="42" text-anchor="middle" class="tiny">Python scraping</text>
    </g>
    <g transform="translate(1638 622)">
      <rect width="160" height="56" rx="10" class="panel-red"/>
      <text x="80" y="24" text-anchor="middle" class="small">Fiscal Service</text>
      <text x="80" y="42" text-anchor="middle" class="tiny">Laravel service</text>
    </g>
    <g transform="translate(1452 704)">
      <rect width="160" height="56" rx="10" class="panel-violet"/>
      <text x="80" y="24" text-anchor="middle" class="small">PDV Mobile</text>
      <text x="80" y="42" text-anchor="middle" class="tiny">planned/offline</text>
    </g>
    <g transform="translate(1638 704)">
