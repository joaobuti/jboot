<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">JBoot AI-first engineering architecture workflow</title>
  <desc id="desc">Neon workflow diagram showing the JBoot AI-first engineering harness, orchestration agents, skills, runtime adapters, validation gates and current satellite implementations.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#12333f"/>
      <stop offset="45%" stop-color="#071d27"/>
      <stop offset="100%" stop-color="#02070d"/>
    </radialGradient>
    <linearGradient id="cyanStroke" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="redStroke" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="violetStroke" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="heavyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#164052" stroke-width="1" opacity="0.42"/>
    </pattern>
    <pattern id="microgrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#1c5362" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38e8ff"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#fb7185"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#86efac"/>
    </marker>
    <style>
      .bg-line { fill: none; stroke: #164052; stroke-width: 2; opacity: .34; }
      .wire-cyan { fill: none; stroke: url(#cyanStroke); stroke-width: 4; filter: url(#softGlow); marker-end: url(#arrowCyan); }
      .wire-red { fill: none; stroke: url(#redStroke); stroke-width: 4; filter: url(#softGlow); marker-end: url(#arrowRed); }
      .wire-green { fill: none; stroke: url(#greenStroke); stroke-width: 4; filter: url(#softGlow); marker-end: url(#arrowGreen); }
      .wire-thin { fill: none; stroke: #4dd7eb; stroke-width: 2; opacity: .72; }
      .panel { fill: rgba(4, 18, 26, .82); stroke: #2dd4bf; stroke-width: 2; filter: url(#softGlow); }
      .panel-red { fill: rgba(32, 10, 18, .82); stroke: #fb7185; stroke-width: 2; filter: url(#softGlow); }
      .panel-green { fill: rgba(6, 24, 15, .82); stroke: #86efac; stroke-width: 2; filter: url(#softGlow); }
      .panel-violet { fill: rgba(18, 15, 40, .82); stroke: #a78bfa; stroke-width: 2; filter: url(#softGlow); }
      .chip { fill: #071d27; stroke: #67e8f9; stroke-width: 2; filter: url(#heavyGlow); }
      .chip-core { fill: #0b2730; stroke: #f8fafc; stroke-width: 2.4; filter: url(#heavyGlow); }
      .ghost { fill: rgba(30, 41, 59, .45); stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 42px; font-weight: 800; fill: #ecfeff; letter-spacing: 0; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 500; fill: #a5f3fc; letter-spacing: 0; }
      .section { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 800; fill: #f8fafc; letter-spacing: 0; }
      .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e2e8f0; letter-spacing: 0; }
      .small { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #b6e7ef; letter-spacing: 0; }
      .tiny { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #86efac; letter-spacing: 0; }
      .muted { fill: #94a3b8; }
      .cyan { fill: #67e8f9; }
      .red { fill: #fb7185; }
      .green { fill: #86efac; }
      .violet { fill: #c4b5fd; }
      .orange { fill: #fdba74; }
      .line { stroke: #67e8f9; stroke-width: 1.5; opacity: .6; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGlow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#microgrid)"/>

  <g opacity=".45">
    <path class="bg-line" d="M80 912 H324 Q352 912 352 884 V768 Q352 740 380 740 H500"/>
    <path class="bg-line" d="M1510 170 H1668 Q1696 170 1696 198 V310 Q1696 338 1724 338 H1848"/>
    <path class="bg-line" d="M104 276 H272 Q300 276 300 304 V392 Q300 420 328 420 H460"/>
    <path class="bg-line" d="M1448 938 H1660 Q1692 938 1692 906 V796 Q1692 764 1724 764 H1846"/>
    <path class="bg-line" d="M670 94 V160 Q670 186 696 186 H812"/>
    <path class="bg-line" d="M1246 96 V170 Q1246 196 1220 196 H1100"/>
  </g>

  <text x="70" y="72" class="title">JBoot AI-FIRST ENGINEERING ARCHITECTURE</text>
  <text x="72" y="106" class="subtitle">Agentes + subagentes + skills + contratos + gates executaveis + implementacoes satelite</text>
  <text x="1612" y="72" text-anchor="end" class="small" fill="#94a3b8">Fonte: docs/ai-architecture.md + contracts em implementations/*</text>

  <!-- Left orchestration rail -->
  <g>
    <rect x="70" y="160" width="430" height="344" rx="18" class="panel"/>
    <text x="96" y="198" class="section" fill="#67e8f9">ORQUESTRACAO GLOBAL</text>
    <text x="96" y="230" class="small">Fluxo obrigatorio para novo projeto/modulo</text>
    <g transform="translate(96 262)">
      <rect width="116" height="52" rx="10" class="chip"/>
      <text x="58" y="24" text-anchor="middle" class="label">PO</text>
      <text x="58" y="42" text-anchor="middle" class="tiny">escopo</text>
    </g>
    <g transform="translate(242 262)">
      <rect width="116" height="52" rx="10" class="chip"/>
      <text x="58" y="24" text-anchor="middle" class="label">PE</text>
      <text x="58" y="42" text-anchor="middle" class="tiny">target/gates</text>
    </g>
    <g transform="translate(388 262)">
      <rect width="86" height="52" rx="10" class="chip"/>
      <text x="43" y="24" text-anchor="middle" class="label">ARCH</text>
      <text x="43" y="42" text-anchor="middle" class="tiny">stack fit</text>
    </g>
    <path d="M212 288 H238" class="wire-thin" marker-end="url(#arrowCyan)"/>
    <path d="M358 288 H384" class="wire-thin" marker-end="url(#arrowCyan)"/>
    <g transform="translate(96 350)">
      <rect width="378" height="52" rx="10" class="panel-violet"/>
      <text x="189" y="24" text-anchor="middle" class="label">Human confirmation</text>
      <text x="189" y="42" text-anchor="middle" class="tiny">arquitetura, stack, risco, custo</text>
    </g>
    <g transform="translate(96 428)">
      <rect width="180" height="44" rx="10" class="chip"/>
      <text x="90" y="27" text-anchor="middle" class="small">PROJECT_CONTRACT</text>
    </g>
    <g transform="translate(294 428)">
      <rect width="180" height="44" rx="10" class="chip"/>
      <text x="90" y="27" text-anchor="middle" class="small">MODULE_CONTRACT</text>
    </g>
  </g>

  <g>
    <rect x="70" y="548" width="430" height="318" rx="18" class="panel-violet"/>
    <text x="96" y="586" class="section" fill="#c4b5fd">ADAPTERS DE RUNTIME IA</text>
    <text x="96" y="618" class="small">Expostos como borda; nao substituem contratos</text>
    <g transform="translate(96 654)">
      <rect width="168" height="42" rx="8" class="ghost"/>
      <text x="84" y="27" text-anchor="middle" class="small">.codex.d</text>
    </g>
    <g transform="translate(282 654)">
      <rect width="168" height="42" rx="8" class="ghost"/>
      <text x="84" y="27" text-anchor="middle" class="small">.claude</text>
    </g>
    <g transform="translate(96 716)">
      <rect width="168" height="42" rx="8" class="ghost"/>
      <text x="84" y="27" text-anchor="middle" class="small">.cursor</text>
    </g>
    <g transform="translate(282 716)">
      <rect width="168" height="42" rx="8" class="ghost"/>
      <text x="84" y="27" text-anchor="middle" class="small">copilot-instructions</text>
    </g>
    <g transform="translate(96 792)">
      <rect width="354" height="42" rx="8" class="ghost"/>
      <text x="177" y="27" text-anchor="middle" class="small">MCP futuro como adapter de borda</text>
    </g>
  </g>

  <!-- Central harness -->
  <g>
    <rect x="630" y="204" width="660" height="560" rx="28" class="chip-core"/>
    <text x="960" y="254" text-anchor="middle" class="section">AI-FIRST ENGINEERING HARNESS</text>
    <text x="960" y="286" text-anchor="middle" class="small">Fonte canonica operacional para agentes que atuam no repositorio</text>

    <g transform="translate(684 326)">
      <rect width="242" height="86" rx="14" class="panel"/>
      <text x="121" y="30" text-anchor="middle" class="label">Context Resolver</text>
      <text x="121" y="54" text-anchor="middle" class="small">target, modulo, branch</text>
      <text x="121" y="72" text-anchor="middle" class="tiny">make ai-context</text>
    </g>
    <g transform="translate(996 326)">
      <rect width="242" height="86" rx="14" class="panel-red"/>
      <text x="121" y="30" text-anchor="middle" class="label">Conformance Gate</text>
      <text x="121" y="54" text-anchor="middle" class="small">controles bloqueantes</text>
      <text x="121" y="72" text-anchor="middle" class="tiny" fill="#fb7185">make ai-conformance</text>
    </g>
    <g transform="translate(684 456)">
      <rect width="242" height="86" rx="14" class="panel-violet"/>
      <text x="121" y="30" text-anchor="middle" class="label">Evals &amp; Attestations</text>
      <text x="121" y="54" text-anchor="middle" class="small">regressao e evidencia</text>
      <text x="121" y="72" text-anchor="middle" class="tiny">make ai-evals / evidence</text>
    </g>
    <g transform="translate(996 456)">
      <rect width="242" height="86" rx="14" class="panel-green"/>
      <text x="121" y="30" text-anchor="middle" class="label">Security Boundary</text>
      <text x="121" y="54" text-anchor="middle" class="small">threat model + tools</text>
      <text x="121" y="72" text-anchor="middle" class="tiny">approval matrix</text>
    </g>
    <g transform="translate(806 596)">
      <rect width="308" height="88" rx="14" class="chip"/>
      <text x="154" y="32" text-anchor="middle" class="label">AI Product Runtime</text>
      <text x="154" y="56" text-anchor="middle" class="small" fill="#94a3b8">src/ai reservado</text>
      <text x="154" y="74" text-anchor="middle" class="tiny">providers, prompts, agents, tools, telemetry</text>
    </g>
    <path d="M926 369 C960 369 960 499 996 499" class="wire-thin"/>
    <path d="M996 369 C960 369 960 499 926 499" class="wire-thin"/>
    <path d="M806 542 V592" class="wire-thin" marker-end="url(#arrowCyan)"/>
    <path d="M1117 542 V592" class="wire-thin" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Top band: global assets -->
  <g>
    <rect x="610" y="112" width="700" height="58" rx="14" class="panel"/>
    <text x="644" y="148" class="label">docs/agents/orchestration</text>
    <text x="890" y="148" class="small" fill="#67e8f9">product-owner / product-engineer / architect / ui-ux / marketing-brand</text>
