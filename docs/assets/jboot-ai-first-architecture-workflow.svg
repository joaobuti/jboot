      <text x="69" y="25" text-anchor="middle" class="small">backend</text>
    </g>
    <g transform="translate(954 924)">
      <rect width="138" height="40" rx="8" class="ghost"/>
      <text x="69" y="25" text-anchor="middle" class="small">domain</text>
    </g>
    <g transform="translate(1110 924)">
