external_api:
  name: Diario de Justica Eletronico Nacional (DJEN) — Comunica PJe
  base_url: https://comunicaapi.pje.jus.br
  spec: https://comunicaapi.pje.jus.br/swagger/djen.yml
  auth_required_for_scope: false
  verified_findings:
    - consulta de comunicacoes e publica; nenhum endpoint de leitura declara security
    - POST /api/v1/login e exclusivo de tribunais (conta SCA/CNJ) e retornou 403 para as credenciais fornecidas
    - rate limit observado de 20 requisicoes por janela por IP com cabecalhos x-ratelimit-*
security_review:
  status: passed
  evidence:
    - credenciais de dev fora do repositorio (.env gitignored) e cifradas em repouso com AES-256-GCM
    - chave derivada por HMAC-SHA256(jwtSecret, clientId), identica ao CryptoService do BFF
    - todas as queries de leitura filtram por client_id do contexto autenticado
    - filtros de listagem sao parametrizados; nenhuma interpolacao de valor em SQL
    - rotas protegidas por JuridicoAuthGuard com scope juridico:read
    - worker respeita rate limit do CNJ; sem uso de multiplos IPs para contorno
  open_items: 0
measurements:
  status: not_exposed
  prompt_tokens: null
  completion_tokens: null
  cost: null
  latency_ms: null
validations:
  - uv run pytest (24 testes, inclui 14 novos de PJe)
  - node --require ts-node/register --test src/modules/juridico/pje/pje.service.spec.ts (11 testes)
  - npx tsc --noEmit (BFF e app: zero erro nos arquivos PJe)
  - npx eslint src/modules/juridico (sem achados)
  - smoke ponta a ponta contra a API real com deduplicacao comprovada e limpeza do banco
  - fluxo real BFF -> worker -> DJEN com JWT do tenant: 96 comunicacoes para OAB 18312/MS em 7 dias
  - make ai-conformance
result: >-
  Integracao PJe/DJEN entregue na Sprint PJE-1: menu PJE, configuracao de monitoramento por tenant,
  fila de sincronizacao no worker com controle de rate limit, endpoints no BFF e tela de
  comunicacoes com detalhe do teor. Correcao de runtime na mesma execucao: o worker juridico (:8020)
  passou a subir no perfil dev-up, com alvo dedicado make juridico-worker-dev e profile documentado
  no contrato; sem ele o BFF respondia 503 nas telas de eProc e PJe.
