result: >-
  A PoC integra o PIX do caixa web ao Checkout InfinitePay por meio do BFF e do
  servico independente Payments em Go. O pagamento manual Pix foi bloqueado;
  uma cobranca idempotente e criada, o Checkout hospedado e aberto e a venda so
  recebe uma linha confirmada depois de payment_check positivo e correlacionado.
  A configuracao BYOA exige declaracao administrativa e preserva somente
  referencia de segredo. Producao segue bloqueada pelos riscos documentados.
