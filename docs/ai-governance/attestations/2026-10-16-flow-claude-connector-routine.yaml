result: >-
  Conector MCP do Flow para uso da assinatura Claude do proprio usuario (OAuth
  2.1 com CIMD no Identity, resource server MCP no BFF, configuracao por tenant,
  consentimento e conexoes na Platform Web) e modo claude_routine portado sobre
  a Sprint 12 da base: agente de rotina no gateway com token cifrado, disparo
  so com identificadores, outbox dispatched com retry limitado a 429/503 e
  conclusao pelo comentario com runId. Nenhuma credencial do Claude.ai
  coletada. Smoke com conta e rotina reais (URL publica), confirmacao comercial
  com a Anthropic e ordem de deploy seguem pendentes; nao e production_ready.
