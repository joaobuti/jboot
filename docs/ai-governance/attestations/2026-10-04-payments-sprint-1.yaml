security_review:
  status: passed
  evidence:
    - checklist preenchido em docs/security/payments-sprint-1-security-checklist.md
    - JWT s2s valida algoritmo, issuer, audience, type e caller allowlisted
    - capability e tenant sao verificados independentemente e queries incluem client_id
    - DTO explicito rejeita campos desconhecidos e limita body a 16 KiB
    - imagem distroless roda nonroot e govulncheck nao encontrou simbolo chamado vulneravel
    - nenhuma credencial InfinitePay, PII de pagador ou secret local foi versionado
