validations:
  - go test -race ./... dentro do container, incluindo PostgreSQL e concorrencia
  - go vet ./... e go build ./cmd/api ./cmd/worker dentro do container
  - testes e typecheck do Identity dentro do container
  - smoke Identity para JWT svc:payments e POST/GET de cobranca aprovado
  - outbox transacional publicado pelo worker
