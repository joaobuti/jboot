schema_version: "1.0.0"

nodes:
  - id: capability:process-monitoring
    type: capability
    label: Process monitoring capability (monitoramento-processual)
    lifecycle: active
    owner: module-contract:bff-jboot-platform/process-monitoring
    source: implementations/bff-jboot-platform/src/modules/process-monitoring/process-monitoring.service.ts
    evidence: docs/architecture/decisions/021-process-monitoring-capability.md
    metadata:
      description: Independent DataJud process monitoring used by Juridico and Flow; single monitor per client and process, with origin and destination.

  - id: capability:process-publications
    type: capability
    label: Process publications capability (publicacoes-processuais, DJEN)
    lifecycle: active
    owner: module-contract:bff-jboot-platform/process-monitoring
    source: implementations/bff-jboot-platform/src/modules/process-monitoring/process-monitoring.service.ts
    evidence: docs/architecture/decisions/022-process-publications-capability.md
    metadata:
      description: DJEN publications by process number for Flow monitors; sold separately and dependent on monitoramento-processual; own Temporal queue process-publications.

  - id: external_system:djen
    type: external_system
    label: DJEN (Diario de Justica Eletronico Nacional, comunicaapi.pje.jus.br)
    lifecycle: active
    owner: module-contract:bff-jboot-platform/process-monitoring
    source: implementations/svc-jboot-juridico-data/src/juridico_data/integrations/djen.py

  - id: capability:flow-ai-completion-movement
    type: capability
    label: Flow explicit AI completion and governed card movement
    lifecycle: active
    owner: kanban
    source: implementations/bff-jboot-platform/src/modules/kanban/automation/movement-automation.service.ts

  - id: capability:ai-automation-completion-signal
    type: capability
    label: Structured automation completion signal
    lifecycle: active
    owner: ai-gateway
    source: implementations/svc-jboot-ai-gateway/src/ai/tools/tool-catalog.ts

  - id: capability:flow-card-actions
    type: capability
    label: Flow manual card actions by column
    lifecycle: active
    owner: kanban
    source: implementations/bff-jboot-platform/src/modules/kanban/actions/card-actions.service.ts

  - id: capability:flow-petition-monitoring
    type: capability
    label: Flow petition process number and monitoring board
    lifecycle: active
    owner: kanban
    source: implementations/bff-jboot-platform/src/modules/kanban/actions/petition-monitoring.service.ts
    metadata:
      description: Approved initial petition gets its CNJ registered manually; the column action Monitorar turns it into a card on a chosen monitoring board with a daily DataJud monitor (flow_petition link in juridico_data_flow_exports).

  - id: capability:flow-process-import
    type: capability
    label: Flow import of ongoing processes from spreadsheet
    lifecycle: active
    owner: kanban
    source: implementations/bff-jboot-platform/src/modules/kanban/process-import/process-import-cards.service.ts
    metadata:
      description: Office imports ongoing lawsuits from .xlsx (name, CPF, CNJ); each ready row becomes customer + card on the chosen board with daily DataJud monitor (flow_import link), processed in the flow-process-import queue.

  - id: repository:jboot
    type: repository
    label: JBoot
    lifecycle: active
    owner: ai-architecture
    source: docs/ai-architecture.md
    metadata:
      description: Repository and AI-first engineering boundary.

  - id: capability:ai-first-engineering-harness
    type: capability
    label: AI-first Engineering Harness
    lifecycle: active
    owner: ai-architecture
    source: docs/ai-architecture.md

  - id: capability:architecture-graph
    type: capability
    label: Architecture Graph
    lifecycle: active
    owner: ai-architecture
    source: docs/ai-governance/records/decisions/2026-10-06-architecture-graph-engineering.md

  - id: integration:juridico-flow
    type: integration
    label: Juridico to Flow Integration
    lifecycle: active
    owner: module-contract:bff-jboot-platform/domain-integrations
    source: implementations/bff-jboot-platform/modules/domain-integrations/MODULE_CONTRACT.md
    metadata:
      description: Cross-domain export, monitoring and process-change coordination.

  - id: tool:architecture-graph-viewer
    type: tool
    label: Architecture Graph Viewer
    lifecycle: active
    owner: ai-architecture
    source: tools/ai/architecture-graph-viewer/package.json

  - id: capability:flow-claude-connector
    type: capability
    label: Flow Claude Connector (MCP)
    lifecycle: active
    owner: kanban
    source: docs/product/kanban-claude-connector-sprints.md
    metadata:
      description: Remote MCP resource server at /kanban/mcp; lifecycle_status functional, external smoke pending.

  - id: capability:identity-oauth-authorization-server
    type: capability
    label: Identity OAuth 2.1 Authorization Server
    lifecycle: active
    owner: identity
    source: implementations/bff-jboot-identity/PROJECT_CONTRACT.md
    metadata:
      description: CIMD clients, PKCE, opaque tokens and s2s introspection for the Flow connector.

  - id: capability:claude-routine-dispatch
    type: capability
    label: Claude Routine Dispatch
    lifecycle: active
    owner: ai-gateway
    source: implementations/svc-jboot-ai-gateway/PROJECT_CONTRACT.md
    metadata:
      description: claude_routine agents fire the owner's Claude Code routine with run identifiers only.

  - id: external_system:anthropic-claude
    type: external_system
    label: Anthropic Claude (Claude.ai, Claude Code Routines)
    lifecycle: active
    owner: kanban
    source: docs/runbooks/flow-claude-connector.md

  - id: capability:flow-customer-documents
    type: capability
    label: Flow Customer Documents
    lifecycle: active
    owner: kanban
    source: docs/product/flow-customer-documents-sprints.md
    metadata:
      description: Versioned attachments on the Flow customer record; CPF/CNPJ mandatory.

  - id: capability:flow-customer-validation
    type: capability
    label: Flow Customer Validation (Claude routine)
    lifecycle: active
    owner: kanban
    source: docs/product/flow-customer-documents-sprints.md
    metadata:
      description: Button-triggered claude_routine validation on the office Claude account (main account as fallback), answered only by office responsibles, confirmed by flow:validation:approve (ADR 018).

  - id: capability:flow-automation-customer-access
    type: capability
    label: Flow automation reads the card customer
    lifecycle: active
    owner: kanban
    source: docs/architecture/decisions/018-flow-validation-by-office-claude-account.md
    metadata:
      description: Connector tools for column automation routines to read the card customer, approved validation and validated document pages.

  - id: capability:flow-office-service-contract
    type: capability
    label: Flow office service contract template
    lifecycle: active
    owner: kanban
    source: docs/product/flow-office-service-contract-sprints.md
    metadata:
      description: Per-office versioned service contract template edited in Quill; free [[TAG]] placeholders filled later by the AI extraction.

  - id: capability:flow-email-automation-outbox
    type: capability
    label: Flow e-mail automation outbox
    lifecycle: active
    owner: kanban
    source: docs/runbooks/flow-email-automations.md
    metadata:
      description: Durable PostgreSQL outbox for column automation e-mails; BullMQ/Valkey only delivers ids; DB-owned retry, terminal failure and manual retry.

  - id: capability:flow-initial-petitions
    type: capability
    label: Flow initial petitions (Claude routine)
    lifecycle: active
    owner: kanban
    source: docs/product/flow-initial-petitions-sprints.md
    metadata:
      description: Column automation with expected result initial_petitions; routine drafts JEC/JEF consignado petitions, Flow assembles the .docx (or receives it from the routine) and holds them for lawyer approval (ADR 020).

