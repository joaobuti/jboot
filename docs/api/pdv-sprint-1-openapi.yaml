openapi: 3.1.0
info:
  title: JBoot PDV Sprint 1 Admin API
  version: 0.1.0
  summary: Contrato inicial para core administrativo do PDV.
servers:
  - url: http://localhost:8010
security:
  - bearerAuth: []
tags:
  - name: Categories
  - name: Products
  - name: EstablishmentCustomers
  - name: Operators
  - name: Inventory
x-jboot-context:
  identity_provider: bff-jboot-identity
  tenant_source: jwt.client_id
  client_id_in_payload: forbidden
  required_claims:
    - sub
    - client_id
    - application_id
    - database_ref
paths:
  /pdv/admin/categories:
    get:
      tags: [Categories]
      summary: List categories for the current client.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Categories page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
    post:
      tags: [Categories]
      summary: Create category for the current client.
      security:
        - bearerAuth: [pdv:admin:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Created category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /pdv/admin/categories/{categoryId}:
    patch:
      tags: [Categories]
      summary: Update category.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Categories]
      summary: Inactivate category.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category inactivated.
  /pdv/admin/products:
    get:
      tags: [Products]
      summary: List products for the current client.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Products page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
    post:
      tags: [Products]
      summary: Create product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /pdv/admin/products/{productId}:
    patch:
      tags: [Products]
      summary: Update product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      tags: [Products]
      summary: Inactivate product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product inactivated.
  /pdv/admin/customers:
    get:
      tags: [EstablishmentCustomers]
      summary: List establishment customers.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Customers page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
    post:
      tags: [EstablishmentCustomers]
      summary: Create establishment customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /pdv/admin/customers/{customerId}:
    patch:
      tags: [EstablishmentCustomers]
      summary: Update establishment customer.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    delete:
      tags: [EstablishmentCustomers]
      summary: Inactivate establishment customer.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '204':
          description: Customer inactivated.
  /pdv/admin/operators:
    get:
      tags: [Operators]
      summary: List operators.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Operators page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorPage'
    post:
      tags: [Operators]
      summary: Create operator linked to an Identity Hub identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperatorRequest'
      responses:
        '201':
          description: Created operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
  /pdv/admin/operators/{operatorId}:
    patch:
      tags: [Operators]
      summary: Update operator.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperatorRequest'
      responses:
        '200':
          description: Updated operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
    delete:
      tags: [Operators]
      summary: Inactivate operator.
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      responses:
        '204':
          description: Operator inactivated.
  /pdv/admin/stock-locations:
    get:
      tags: [Inventory]
      summary: List stock locations.
      responses:
        '200':
          description: Stock locations page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocationPage'
    post:
      tags: [Inventory]
      summary: Create stock location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStockLocationRequest'
      responses:
        '201':
          description: Created stock location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLocation'
  /pdv/admin/inventory-balances:
    get:
      tags: [Inventory]
      summary: List inventory balances.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory balances page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBalancePage'
  /pdv/admin/inventory-adjustments:
    post:
      tags: [Inventory]
      summary: Register manual inventory adjustment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryAdjustmentRequest'
      responses:
        '201':
          description: Created inventory movement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovement'
  /pdv/admin/inventory-imports:
    get:
      tags: [Inventory]
      summary: List inventory imports.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Inventory imports page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImportPage'
    post:
      tags: [Inventory]
      summary: Create inventory batch import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryImportRequest'
      responses:
        '201':
          description: Created inventory import.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImport'
  /pdv/admin/inventory-imports/{inventoryImportId}:
    get:
      tags: [Inventory]
      summary: Get inventory import details.
      parameters:
        - name: inventoryImportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory import details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryImport'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 160
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/Status'
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperatorId:
      name: operatorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Status:
      type: string
      enum: [active, inactive]
    PageMeta:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    Category:
      type: object
      required: [id, name, slug, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          maxLength: 160
        description:
          type: [string, 'null']
    UpdateCategoryRequest:
      type: object
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          maxLength: 160
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/Status'
    CategoryPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Product:
      type: object
      required: [id, name, unit, salePrice, trackInventory, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: [string, 'null']
          format: uuid
        sku:
          type: [string, 'null']
        barcode:
          type: [string, 'null']
        name:
          type: string
        description:
          type: [string, 'null']
        unit:
          type: string
        salePrice:
          type: string
          pattern: '^[0-9]+(\\.[0-9]{1,2})?$'
        costPrice:
          type: [string, 'null']
          pattern: '^[0-9]+(\\.[0-9]{1,2})?$'
        trackInventory:
          type: boolean
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required: [name, unit, salePrice]
      properties:
        categoryId:
          type: [string, 'null']
          format: uuid
        sku:
          type: [string, 'null']
          maxLength: 80
        barcode:
          type: [string, 'null']
          maxLength: 80
        name:
          type: string
          maxLength: 200
        description:
          type: [string, 'null']
        unit:
          type: string
          maxLength: 16
        salePrice:
          type: string
        costPrice:
          type: [string, 'null']
        trackInventory:
          type: boolean
          default: true
    UpdateProductRequest:
      allOf:
        - $ref: '#/components/schemas/CreateProductRequest'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/Status'
    ProductPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Customer:
      type: object
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        documentNumber:
          type: [string, 'null']
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        documentNumber:
          type: [string, 'null']
          maxLength: 32
        email:
          type: [string, 'null']
          maxLength: 180
        phone:
          type: [string, 'null']
          maxLength: 40
    UpdateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CreateCustomerRequest'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/Status'
    CustomerPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Operator:
      type: object
      required: [id, identityId, displayName, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        identityId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [master, manager, cashier]
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateOperatorRequest:
      type: object
      required: [identityId, displayName, role]
      properties:
        identityId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 160
        role:
          type: string
          enum: [master, manager, cashier]
    UpdateOperatorRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 160
        role:
          type: string
          enum: [master, manager, cashier]
        status:
          $ref: '#/components/schemas/Status'
    OperatorPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Operator'
        meta:
          $ref: '#/components/schemas/PageMeta'
    StockLocation:
      type: object
      required: [id, name, type, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [store, warehouse, virtual]
        status:
          $ref: '#/components/schemas/Status'
    CreateStockLocationRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 160
        type:
          type: string
          enum: [store, warehouse, virtual]
    StockLocationPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockLocation'
        meta:
          $ref: '#/components/schemas/PageMeta'
    InventoryBalance:
      type: object
      required: [productId, locationId, quantity, reservedQuantity, updatedAt]
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        quantity:
          type: string
        reservedQuantity:
          type: string
        updatedAt:
          type: string
          format: date-time
    InventoryBalancePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryBalance'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CreateInventoryAdjustmentRequest:
      type: object
      required: [productId, locationId, type, quantity]
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        type:
          type: string
          enum: [initial, adjustment_in, adjustment_out]
        quantity:
          type: string
        reason:
          type: [string, 'null']
          maxLength: 160
    InventoryMovement:
      type: object
      required: [id, productId, locationId, type, quantity, sourceType, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        type:
          type: string
        quantity:
          type: string
        reason:
          type: [string, 'null']
        sourceType:
          type: string
        occurredAt:
          type: string
          format: date-time
    InventoryImport:
      type: object
      required: [id, locationId, status, totalRows, processedRows, failedRows, createdAt]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, processed, processed_with_errors, failed]
        fileName:
          type: [string, 'null']
        totalRows:
          type: integer
        processedRows:
          type: integer
        failedRows:
          type: integer
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: [string, 'null']
          format: date-time
    CreateInventoryImportRequest:
      type: object
      required: [locationId, rows]
      properties:
        locationId:
          type: string
          format: uuid
        fileName:
          type: [string, 'null']
          maxLength: 240
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CreateInventoryImportRow'
    CreateInventoryImportRow:
      type: object
      required: [quantity]
      properties:
        productId:
          type: [string, 'null']
          format: uuid
        sku:
          type: [string, 'null']
          maxLength: 80
        barcode:
          type: [string, 'null']
          maxLength: 80
        quantity:
          type: string
        reason:
          type: [string, 'null']
          maxLength: 160
    InventoryImportPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryImport'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
