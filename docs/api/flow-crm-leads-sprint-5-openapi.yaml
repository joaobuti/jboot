openapi: 3.1.0
info:
  title: JBoot Flow CRM De Leads Sprint 5 API
  version: 0.1.0
  summary: >
    Contrato incremental da Sprint 5 de docs/product/flow-crm-leads-sprints.md:
    tipos de caso (com criterios de classificacao) e modelos de documento `.docx`
    versionados, com deteccao e validacao de variaveis contra o catalogo em
    codigo (ADR 014, Decisoes 1 e 4). Configuracao do tenant, somente
    `flow:admin`. Estende flow-crm-leads-sprint-1/2/3/3-5/4-openapi.yaml; nenhuma
    rota existente muda.
  x-implementation-status: >
    Implementado em 2026-10-12 em
    implementations/bff-jboot-platform/src/modules/kanban/case-types/ e
    implementations/bff-jboot-platform/src/modules/kanban/document-templates/
    (migration docker/postgres/init/065_kanban_case_types_templates.sql).
servers:
  - url: http://localhost:8010
security:
  - bearerAuth: []
tags:
  - name: CaseTypes
  - name: DocumentTemplates
  - name: TemplateVariables
x-jboot-context:
  identity_provider: bff-jboot-identity
  tenant_source: jwt.client_id
  client_id_in_payload: forbidden
  authorization: >
    Toda rota exige scope `flow:admin` (ScopeGuard, 403 do guard) e o servico
    confere de novo (403 `template_admin_required`). Operador de escritorio e
    `board_admin` sem `flow:admin` recebem 403. Nao e conteudo de card: nao passa
    pelo CardVisibilityService.
  template_syntax: >
    Delimitador `{{ }}`; tag = caminho `^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$`
    (espacos nas pontas ignorados); laco `{{#lead.casos}}...{{/lead.casos}}` so
    sobre colecao do catalogo; condicional `{{#x}}`/`{{^x}}` so sobre booleano do
    catalogo. Sem filtros, sem expressoes, sem `{{@...}}` (XML bruto). A
    formatacao vem pronta do catalogo.
  upload_pipeline: >
    Ordem, falha fechada: (0) flow:admin e modelo do tenant; (1) regras dos
    anexos (`assertAttachmentFileAllowed`: 25 MB, allowlist, assinatura ZIP) +
    so `.docx` (tipo e extensao) + 10 MB; (2) em worker thread com timeout 20 s e
    heap 512 MB: diretorio central do ZIP lido sem descompactar (<= 2.000
    entradas, <= 50 MB descompactado declarado, razao <= 100:1 total e por
    entrada >= 1 MB; ZIP64/criptografia/multi-disco/metodo desconhecido/nome
    inseguro/duplicado/sobreposto recusados), descompactacao propria limitada ao
    tamanho declarado com CRC; (3) pacote Word: content type principal
    `wordprocessingml.document.main+xml`; recusa `.docm`/`.dotm`/vbaProject,
    ActiveX/OLE/embeddings/altChunk, relacionamento externo que nao seja
    hyperlink (modelo anexo externo = aviso) e campos DDE/INCLUDEPICTURE/
    INCLUDETEXT/LINK/IMPORT; (4) compilacao docxtemplater (erros multiplos =
    lista); (5) inspect-module + gramatica + catalogo; (6) aviso de tag quase
    certa; (7) render de prova com dados sinteticos; (8) objeto no storage e
    versao + variaveis numa transacao (falha remove o objeto).
  storage: >
    Bucket do modulo (`kanban-card-attachments`), chave
    `{client_id}/templates/{template_id}/{version_id}.docx` (sem nome de
    arquivo; CHECK no banco), `sha256` do arquivo enviado. Download por URL
    assinada de 5 min com nome `<modelo> - v<n>.docx`.
  immutability: >
    Versao imutavel (trigger recusa UPDATE/DELETE). Variaveis detectadas
    imutaveis exceto `required`. Trocar o arquivo = versao nova; a anterior fica
    no historico e documento gerado (S6) referencia a versao usada.
  generation_contract_s6: >
    A geracao usa a versao ATUAL do modelo padrao do tipo de caso (ou do modelo
    vinculado escolhido) somente se ela for `valid`; sem fallback para versao
    anterior. Regra em `generation-template.ts`
    (`DocumentTemplatesService.resolveForGeneration`); erros
    `case_type_not_found` (404), `case_type_inactive`, `template_not_linked`,
    `case_type_without_default_template`, `template_inactive`,
    `template_without_version`, `template_version_not_usable` (422). Sem rota na S5.
paths:
  /kanban/template-variables:
    get:
      tags: [TemplateVariables]
      summary: Catalogo de variaveis (versao, namespaces, uso pronto para colar e exemplo sintetico)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateCatalog' }
        '403': { description: '`template_admin_required`' }
  /kanban/case-types:
    get:
      tags: [CaseTypes]
      summary: Tipos de caso do tenant (ativos primeiro; LIMIT 500). Comeca vazio (P1)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CaseType' } }
        '403': { description: '`template_admin_required`' }
    post:
      tags: [CaseTypes]
      summary: Cria tipo de caso (ativo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseType' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseType' }
        '403': { description: '`template_admin_required`' }
        '409': { description: '`case_type_name_taken` (nome igual a outro ATIVO, sem caixa/espacos)' }
        '422': { description: '`template_not_allowed` (modelo de outro tenant/inexistente ou vinculo novo a modelo inativo); `default_template_not_linked`' }
  /kanban/case-types/{caseTypeId}:
    parameters:
      - $ref: '#/components/parameters/CaseTypeId'
    get:
      tags: [CaseTypes]
      summary: Tipo de caso
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseType' }
        '404': { description: '`case_type_not_found`' }
    patch:
      tags: [CaseTypes]
      summary: Altera; campos ausentes mantem; `null`/texto vazio limpa os opcionais. Sem exclusao (`active=false`)
      description: >
        `templateIds` substitui o conjunto de vinculos. O padrao precisa estar no
        conjunto final; remover o vinculo do padrao sem informar
        `defaultTemplateId` = 422 `default_template_not_linked`. Vinculo existente
        a modelo inativo pode ser mantido; vinculo novo exige modelo ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCaseType' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseType' }
        '404': { description: '`case_type_not_found`' }
        '409': { description: '`case_type_name_taken`' }
        '422': { description: '`template_not_allowed`; `default_template_not_linked`' }
  /kanban/document-templates:
    get:
      tags: [DocumentTemplates]
      summary: Modelos do tenant com a versao atual e o numero de tipos de caso vinculados (LIMIT 500)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DocumentTemplate' } }
    post:
      tags: [DocumentTemplates]
      summary: Cria modelo sem arquivo (o arquivo entra por versao)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDocumentTemplate' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplateDetail' }
        '409': { description: '`template_name_taken`' }
  /kanban/document-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [DocumentTemplates]
      summary: Modelo, historico de versoes (LIMIT 100), variaveis da versao atual e tipos de caso vinculados
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplateDetail' }
        '404': { description: '`template_not_found`' }
    patch:
      tags: [DocumentTemplates]
      summary: Nome, descricao, ativo. Sem exclusao
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDocumentTemplate' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTemplateDetail' }
        '404': { description: '`template_not_found`' }
        '409': { description: '`template_name_taken`' }
  /kanban/document-templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [DocumentTemplates]
      summary: Envia versao nova (multipart, campo `file`); vira a versao atual
      description: >
        Ver `x-jboot-context.upload_pipeline`. Variavel desconhecida NAO recusa:
        a versao e salva com `validationStatus = invalid_variables` e
        `usableForGeneration = false` ate o envio de versao corrigida.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: '.docx, ate 10 MB' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersionDetail' }
        '400': { description: '`file_required`' }
        '404': { description: '`template_not_found`' }
        '413': { description: '`file_too_large` / `template_too_large` (limite do multer = 10 MB)' }
        '415': { description: '`content_type_not_allowed`, `content_signature_mismatch`, `template_content_type_not_allowed`' }
        '422':
          description: >
            `template_archive_invalid` (`reason`), `template_archive_limits_exceeded`
            (`limit` = entries | uncompressed_size | compression_ratio, `value`,
            `max`), `template_not_word_document`, `template_macro_forbidden`,
            `template_embedded_object_forbidden`, `template_external_link_forbidden`
            (`relationship` ou `field`), `template_invalid` (`errors[]` com `id`,
            `tag`, `part`, `offset`), `template_raw_xml_forbidden` (`tags`),
            `template_tag_invalid` (`tags`), `template_variable_kind_mismatch`
            (`tags[]` com `tag`, `expected`, `usage`), `template_render_failed`,
            `template_validation_timeout`, `template_too_complex`. Corpo sem nome
            de arquivo e sem dado de cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /kanban/document-templates/{templateId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [DocumentTemplates]
      summary: Versao com variaveis detectadas, desconhecidas e avisos
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersionDetail' }
        '404': { description: '`template_not_found` / `template_version_not_found`' }
  /kanban/document-templates/{templateId}/versions/{versionId}/variables:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/VersionId'
    patch:
      tags: [DocumentTemplates]
      summary: Marca variaveis da versao como obrigatorias/opcionais (default obrigatoria)
      description: >
        Unica mudanca permitida numa versao. Na geracao (S6), obrigatoria sem
        valor bloqueia e lista os campos; opcional sem valor sai como
        `[PREENCHER: <campo>]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [key, required]
                    properties:
                      key: { type: string, maxLength: 200 }
                      required: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersionDetail' }
        '404': { description: '`template_not_found` / `template_version_not_found`' }
        '422': { description: '`template_variable_not_found` (`keys`); `template_variable_duplicated`' }
  /kanban/document-templates/{templateId}/versions/{versionId}/download:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [DocumentTemplates]
      summary: URL assinada (5 min) do arquivo enviado exatamente como foi recebido
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '404': { description: '`template_not_found` / `template_version_not_found`' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CaseTypeId: { name: caseTypeId, in: path, required: true, schema: { type: string, format: uuid } }
    TemplateId: { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
    CreateCaseType:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        classificationCriteria: { type: [string, 'null'], maxLength: 8000 }
        expectedEvidence: { type: [string, 'null'], maxLength: 4000 }
        templateIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
        defaultTemplateId: { type: [string, 'null'], format: uuid }
    UpdateCaseType:
      allOf:
        - $ref: '#/components/schemas/CreateCaseType'
        - type: object
          properties:
            active: { type: boolean }
      description: Todos os campos opcionais.
    CaseType:
      type: object
      required: [id, name, description, classificationCriteria, expectedEvidence, active, defaultTemplateId, templates, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        classificationCriteria: { type: [string, 'null'] }
        expectedEvidence: { type: [string, 'null'] }
        active: { type: boolean }
        defaultTemplateId: { type: [string, 'null'], format: uuid }
        templates:
          type: array
          items:
            type: object
            required: [id, name, active]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDocumentTemplate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
    UpdateDocumentTemplate:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        active: { type: boolean }
    VersionStatus:
      type: string
      enum: [valid, invalid_variables]
    DocumentTemplate:
      type: object
      required: [id, name, description, active, currentVersion, caseTypeCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        currentVersion:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, version, validationStatus, createdAt]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                validationStatus: { $ref: '#/components/schemas/VersionStatus' }
                createdAt: { type: string, format: date-time }
        caseTypeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/DocumentTemplate'
        - type: object
          required: [versions, current, caseTypes]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/TemplateVersion' } }
            current:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/TemplateVersionDetail'
            caseTypes:
              type: array
              items:
                type: object
                required: [id, name, active, isDefault]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  active: { type: boolean }
                  isDefault: { type: boolean }
    TemplateVersion:
      type: object
      required: [id, templateId, version, fileName, sizeBytes, sha256, catalogVersion, validationStatus, usableForGeneration, isCurrent, unknownVariables, warnings, uploadedByIdentityId, createdAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        fileName: { type: string, description: Nome original (so no banco; nunca na chave do objeto) }
        sizeBytes: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        catalogVersion: { type: integer }
        validationStatus: { $ref: '#/components/schemas/VersionStatus' }
        usableForGeneration: { type: boolean, description: 'versao atual e `valid`' }
        isCurrent: { type: boolean }
        unknownVariables: { type: array, items: { type: string } }
        warnings:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [possible_malformed_tag, attached_template_external] }
              detail: { type: string }
        uploadedByIdentityId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    TemplateVersionDetail:
      allOf:
        - $ref: '#/components/schemas/TemplateVersion'
        - type: object
          required: [variables]
          properties:
            variables:
              type: array
              items:
                type: object
                required: [key, known, valueType, label, required]
                properties:
                  key: { type: string, description: 'ex.: cliente.nome; campo de laco = lead.casos[].tipo' }
                  known: { type: boolean }
                  valueType: { type: [string, 'null'], enum: [text, boolean, collection, null] }
                  label: { type: [string, 'null'] }
                  required: { type: boolean }
    TemplateCatalog:
      type: object
      required: [catalogVersion, delimiters, namespaces]
      properties:
        catalogVersion: { type: integer }
        delimiters:
          type: object
          properties:
            start: { const: '{{' }
            end: { const: '}}' }
        namespaces:
          type: array
          items:
            type: object
            required: [key, label, description, variables]
            properties:
              key: { type: string, enum: [cliente, escritorio, lead, caso, data] }
              label: { type: string }
              description: { type: string }
              variables:
                type: array
                items:
                  type: object
                  required: [key, label, description, valueType, source, usage, example]
                  properties:
                    key: { type: string }
                    label: { type: string }
                    description: { type: string }
                    valueType: { type: string, enum: [text, boolean, collection] }
                    source: { type: string, enum: [cliente, cliente_juridico, escritorio, lead, caso, sistema] }
                    usage: { type: string, description: 'trecho pronto para colar no Word' }
                    example: { type: [string, boolean, 'null'], description: 'valor formatado com dados SINTETICOS' }
                    items:
                      type: array
                      items:
                        type: object
                        required: [key, label, description, example]
                        properties:
                          key: { type: string }
                          label: { type: string }
                          description: { type: string }
                          example: { type: [string, 'null'] }
